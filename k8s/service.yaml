apiVersion: v1
kind: Service
metadata:
  name: devops-microservice
  namespace: devops-microservice
  labels:
    app: devops-microservice
  annotations:
    # Compatible con cloud providers (AWS, GCP, Azure) y Minikube (minikube tunnel)
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: devops-microservice
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
