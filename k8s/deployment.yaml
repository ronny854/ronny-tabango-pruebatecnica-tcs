apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-microservice
  namespace: devops-microservice
  labels:
    app: devops-microservice
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-microservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: devops-microservice
        version: "1.0.0"
    spec:
      # Distribuir pods en diferentes nodos para alta disponibilidad
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - devops-microservice
                topologyKey: kubernetes.io/hostname
      containers:
        - name: devops-microservice
          image: devops-microservice:latest
          # IfNotPresent: compatible con Minikube (local) y con registries en la nube
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: devops-microservice-config
            - secretRef:
                name: devops-microservice-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
