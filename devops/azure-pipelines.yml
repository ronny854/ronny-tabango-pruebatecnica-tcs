trigger:
  branches:
    include:
      - '*'
  paths:
    include:
      - api_python/**
      - devops/**
      - k8s/**

pr:
  branches:
    include:
      - main
      - master
      - develop

# Parámetros para ejecución bajo demanda
parameters:
  - name: semanticVersion
    displayName: 'Rollback a versión (none = ejecución normal CI+CD)'
    type: string
    default: 'none'

  - name: imageName
    displayName: 'Nombre de la imagen Docker'
    type: string
    default: 'ronnytabango/devops-microservice'
  - name: sonarProjectName
    displayName: 'Nombre del proyecto en SonarCloud'
    type: string
    default: 'ronny-tabango-pruebatecnica-tcs'
  - name: sonarOrganization
    displayName: 'SonarCloud Organization (ej: tu-org-sonarcloud)'
    type: string
    default: 'ronny854'

variables:
  - name: containerRegistry
    value: 'docker.io'
  - name: dockerHubServiceConnection
    value: 'dockerRegistryServiceConnection'
  - name: sonarServiceConnection
    value: 'conection-sonarqube-github-account'

stages:
  # ---- Etapa 1: CI - Integración Continua (solo cuando semanticVersion == none) ----
  - template: stages/ci.yml
    parameters:
      imageName: ${{ parameters.imageName }}
      semanticVersion: ${{ parameters.semanticVersion }}
      sonarProjectName: ${{ parameters.sonarProjectName }}
      sonarOrganization: ${{ parameters.sonarOrganization }}

  # ---- Etapa 2: CD - Despliegue Continuo ----
  - template: stages/cd.yml
    parameters:
      imageName: ${{ parameters.imageName }}
      semanticVersion: ${{ parameters.semanticVersion }}
      ${{ if eq(parameters.semanticVersion, 'none') }}:
        dependsOn: 'CI'
      ${{ else }}:
        dependsOn: ''
