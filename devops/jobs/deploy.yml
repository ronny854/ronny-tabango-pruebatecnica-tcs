parameters:
  - name: imageName
    type: string
    default: 'devops-microservice'
  - name: semanticVersion
    type: string
    default: 'none'

jobs:
  - job: DeployJob
    displayName: 'Deploy del microservicio'
    pool:
      vmImage: 'ubuntu-latest'
    ${{ if eq(parameters.semanticVersion, 'none') }}:
      variables:
        imageFullName: $[ stageDependencies.CI.TestJob.outputs['PushDockerHub.imageFullName'] ]
        tagImage: $[ stageDependencies.CI.TestJob.outputs['PushDockerHub.tagImage'] ]
    steps:
      - checkout: self

      # Cuando semanticVersion != none → rollback: verificar que la versión exista en DockerHub
      - script: |
          echo "Verificando si la versión ${{ parameters.semanticVersion }} existe en DockerHub..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/$(containerRegistry)/tags/${{ parameters.semanticVersion }}")
          if [ "$RESPONSE" = "200" ]; then
            echo "La versión ${{ parameters.semanticVersion }} existe en DockerHub. Procediendo con el rollback..."
          else
            echo "##vso[task.logissue type=error]ERROR: La versión ${{ parameters.semanticVersion }} NO existe en DockerHub. No se puede realizar el rollback."
            echo "##vso[task.complete result=Failed;]Versión no encontrada en DockerHub"
            exit 1
          fi
        displayName: 'Verificar versión en DockerHub (rollback)'
        condition: and(succeeded(), ne('${{ parameters.semanticVersion }}', 'none'))

      # Despliegue normal - usa output del CI
      - script: |
          echo "Iniciando deploy..."
          echo "Imagen: $(imageFullName):$(tagImage)"
        displayName: 'Iniciando deploy (normal)'
        condition: and(succeeded(), eq('${{ parameters.semanticVersion }}', 'none'))

      # Despliegue rollback
      - script: |
          echo "Iniciando deploy..."
          echo "Modo rollback: desplegando $(containerRegistry)/${{ parameters.imageName }}:${{ parameters.semanticVersion }}"
        displayName: 'Iniciando deploy (rollback)'
        condition: and(succeeded(), ne('${{ parameters.semanticVersion }}', 'none'))
