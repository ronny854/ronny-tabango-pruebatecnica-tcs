parameters:
  - name: imageName
    type: string
    default: 'devops-microservice'
  - name: semanticVersion
    type: string
    default: 'none'

jobs:
  - job: DeployJob
    displayName: 'Deploy del microservicio en Minikube'
    pool: minikube-agents
    ${{ if eq(parameters.semanticVersion, 'none') }}:
      variables:
        imageFullNameTag: $[ stageDependencies.CI.TestJob.outputs['PushDockerHub.imageFullNameTag'] ]
    steps:
      - checkout: self

      # Verificar conectividad SSH con minikube-server
      - script: |
          set -euo pipefail
          echo "Verificando conexión SSH con minikube-server..."
          ssh minikube-server "echo 'SSH OK' && minikube status"
        displayName: 'Verificar conexión SSH con minikube-server'

      # Cuando semanticVersion != none → rollback: verificar que la versión exista en DockerHub
      - script: |
          set -euo pipefail
          echo "Verificando si la versión ${{ parameters.semanticVersion }} existe en DockerHub..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/$(containerRegistry)/${{ parameters.imageName }}/tags/${{ parameters.semanticVersion }}")
          if [ "$RESPONSE" = "200" ]; then
            echo "La versión ${{ parameters.semanticVersion }} existe en DockerHub. Procediendo con el rollback..."
          else
            echo "##vso[task.logissue type=error]ERROR: La versión ${{ parameters.semanticVersion }} NO existe en DockerHub. No se puede realizar el rollback."
            echo "##vso[task.complete result=Failed;]Versión no encontrada en DockerHub"
            exit 1
          fi
        displayName: 'Verificar versión en DockerHub (rollback)'
        condition: and(succeeded(), ne('${{ parameters.semanticVersion }}', 'none'))

      # Deploy en minikube via SSH
      - template: ../steps/deploy-minikube.yml
        parameters:
          imageName: ${{ parameters.imageName }}
          semanticVersion: ${{ parameters.semanticVersion }}
