parameters:
  - name: imageName
    type: string
    default: 'devops-microservice'

jobs:
  - job: BuildJob
    displayName: 'Build del proyecto y Docker'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - checkout: self

      # Leer versión de configVersion.json como tag de imagen
      - script: |
          VERSION=$(python3 -c "import json; print(json.load(open('configVersion.json'))['version'])")
          echo "##vso[task.setvariable variable=configVersion;isOutput=true]$VERSION"
          echo "Versión leída de configVersion.json: $VERSION"
        displayName: 'Leer versión de configVersion.json'
        name: readVersion

      - template: ../steps/install-dependencies.yml
        parameters:
          workingDirectory: 'api_python'

      - script: |
          python -c "from app import app; print('Build del proyecto exitoso')"
        displayName: 'Validar build del proyecto'
        workingDirectory: 'api_python'

      - template: ../steps/build-docker.yml
        parameters:
          dockerfilePath: 'api_python/Dockerfile'
          context: 'api_python'
          imageName: ${{ parameters.imageName }}

      - task: CopyFiles@2
        displayName: 'Copiar código fuente al artefacto'
        inputs:
          SourceFolder: 'api_python'
          Contents: |
            **/*.py
            requirements.txt
          TargetFolder: '$(Build.ArtifactStagingDirectory)/source'

      - task: CopyFiles@2
        displayName: 'Copiar configVersion.json al artefacto'
        inputs:
          Contents: 'configVersion.json'
          TargetFolder: '$(Build.ArtifactStagingDirectory)'

      - task: PublishBuildArtifacts@1
        displayName: 'Publicar artefactos de build'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)'
          ArtifactName: 'build-artifacts'
