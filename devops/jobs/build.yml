parameters:
  - name: imageName
    type: string
    default: 'devops-microservice'

jobs:
  - job: BuildJob
    displayName: 'Build App Python'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - checkout: self

      - script: |
          VERSION=$(python3 -c "import json; print(json.load(open('configVersion.json'))['version'])")
          echo "##vso[task.setvariable variable=configVersion;isOutput=true]$VERSION"
          echo "##vso[task.setvariable variable=configVersion]$VERSION"
          echo "Version: $VERSION"
        displayName: 'Read Version'
        name: readVersion

      - template: ../steps/python/install-dependencies.yml
        parameters:
          workingDirectory: 'api_python'

      - script: |
          python -c "from app import app; print('Build OK')"
        displayName: 'Validate Python Build'
        workingDirectory: 'api_python'

      - task: CopyFiles@2
        displayName: 'Copy Source Code'
        inputs:
          SourceFolder: 'api_python'
          Contents: |
            **/*.py
            requirements.txt
          TargetFolder: '$(Build.ArtifactStagingDirectory)/source'

      - task: CopyFiles@2
        displayName: 'Copy configVersion.json'
        inputs:
          Contents: 'configVersion.json'
          TargetFolder: '$(Build.ArtifactStagingDirectory)'

      - task: PublishBuildArtifacts@1
        displayName: 'Publish Build Artifacts'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)'
          ArtifactName: 'build-artifacts'
