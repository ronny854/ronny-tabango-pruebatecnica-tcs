parameters:
  - name: imageName
    type: string
    default: 'devops-microservice'

steps:
  - script: |
      set -euo pipefail
      safeFileName=$(echo "${{ parameters.imageName }}" | tr '/' '-')
      imageFullName=$(containerRegistry)/${{ parameters.imageName }}
      tagImage=$(configVersion)
      docker load < "$(Pipeline.Workspace)/build-artifacts/docker/${safeFileName}-${tagImage}.tar.gz"
    displayName: 'Cargar imagen Docker desde artefacto'

  - script: |
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    displayName: 'Instalar Trivy'

  - script: |
      set -euo pipefail
      imageFullName=$(containerRegistry)/${{ parameters.imageName }}
      tagImage=$(configVersion)
      trivy image \
        --format table \
        --exit-code 1 \
        --severity CRITICAL,HIGH \
        --ignore-unfixed \
        --output $(Common.TestResultsDirectory)/trivy-report.txt \
        ${imageFullName}:${tagImage}
    displayName: 'Escanear imagen con Trivy'
    continueOnError: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publicar reporte Trivy'
    inputs:
      PathtoPublish: '$(Common.TestResultsDirectory)/trivy-report.txt'
      ArtifactName: 'trivy-report'
    condition: always()
