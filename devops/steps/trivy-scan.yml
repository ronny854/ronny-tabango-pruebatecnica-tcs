parameters:
  - name: imageName
    type: string
    default: 'devops-microservice'

steps:
  - script: |
      docker load < $(Pipeline.Workspace)/build-artifacts/docker/${{ parameters.imageName }}-$(configVersion).tar.gz
    displayName: 'Cargar imagen Docker desde artefacto'

  - script: |
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    displayName: 'Instalar Trivy'

  - script: |
      trivy image \
        --format table \
        --exit-code 1 \
        --severity CRITICAL,HIGH \
        --ignore-unfixed \
        --output $(Common.TestResultsDirectory)/trivy-report.txt \
        ${{ parameters.imageName }}:$(configVersion)
    displayName: 'Escanear imagen con Trivy'
    continueOnError: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publicar reporte Trivy'
    inputs:
      PathtoPublish: '$(Common.TestResultsDirectory)/trivy-report.txt'
      ArtifactName: 'trivy-report'
    condition: always()
