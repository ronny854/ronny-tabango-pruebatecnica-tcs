parameters:
  - name: imageName
    type: string
    default: 'devops-microservice'
  - name: semanticVersion
    type: string
    default: 'none'

steps:
  # Transferir directorio k8s/ al servidor minikube via SCP
  - script: |
      set -euo pipefail
      echo "Imagen: $(imageFullNameTag)"
      echo "Imagen2: ${imageFullNameTag}"
      echo "Inyectando imagen en deployment.yaml"
      sed -i "s|IMAGE_PLACEHOLDER|$(imageFullNameTag)|g" k8s/deployment.yaml
      echo "Transfiriendo manifiestos k8s al servidor minikube..."
      ssh minikube-server "rm -rf /tmp/k8s-manifests && mkdir -p /tmp/k8s-manifests"
      scp -r $(Build.SourcesDirectory)/k8s/* minikube-server:/tmp/k8s-manifests/
      echo "Manifiestos transferidos correctamente"
      ssh minikube-server "ls -la /tmp/k8s-manifests/"
    displayName: 'Transferir manifiestos k8s a minikube-server'

  # Transferir script de deploy
  - script: |
      set -euo pipefail
      echo "Transfiriendo script de deploy..."
      scp $(Build.SourcesDirectory)/devops/scripts/deploy.sh minikube-server:/tmp/deploy.sh
      ssh minikube-server "chmod +x /tmp/deploy.sh"
    displayName: 'Transferir deploy.sh a minikube-server'

  # Ejecutar deploy en modo normal
  - script: |
      set -euo pipefail
      echo "Ejecutando deploy normal..."
      echo "Imagen: $(imageFullNameTag)"
      ssh minikube-server "/tmp/deploy.sh '$(imageFullNameTag)'"
    displayName: 'Ejecutar deploy en minikube (normal)'
    condition: and(succeeded(), eq('${{ parameters.semanticVersion }}', 'none'))

  # Ejecutar deploy en modo rollback
  - script: |
      set -euo pipefail
      echo "Ejecutando rollback a versión ${{ parameters.semanticVersion }}..."
      ssh minikube-server "/tmp/deploy.sh '$(containerRegistry)/${{ parameters.imageName }}' '${{ parameters.semanticVersion }}' '${{ parameters.semanticVersion }}'"
    displayName: 'Ejecutar deploy en minikube (rollback)'
    condition: and(succeeded(), ne('${{ parameters.semanticVersion }}', 'none'))
